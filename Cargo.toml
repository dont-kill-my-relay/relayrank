[package]
name = "relay-rank"
version = "0.1.0"
edition = "2024"

[features]
# default = ["bench"]
bench = []

[dependencies]
anyhow = "1.0.102"
base64 = "0.22.1"
bitflags = "2.13.0"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
derive_more = { version = "2.1.1", features = ["full"] }
hex = "0.4.3"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3.21.0", features = ["base64"] }

[dev-dependencies]
criterion = "0.8.2"

[profile.bench]
debug = true

[[bench]]
name = "consensus_parse"
harness = false
required-features = ["bench"]

[[bench]]
name = "descriptor_parse"
harness = false
required-features = ["bench"]
